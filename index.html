<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perpustakaan Novel Offline</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Novel">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#f6f4ef;--surface:#ffffff;--text:#1d1d1f;--muted:#6b6b70;--border:#e3e0d8;
  --accent:#2f6f5e;--accent-ink:#ffffff;--danger:#b3261e;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="sepia"]){
    --bg:#121314;--surface:#1c1d1f;--text:#e8e6e1;--muted:#9a9a9f;--border:#2c2d30;
    --accent:#6fc1a9;--accent-ink:#0d1f1a;--danger:#f2b8b5;
    --shadow:0 1px 3px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121314;--surface:#1c1d1f;--text:#e8e6e1;--muted:#9a9a9f;--border:#2c2d30;
  --accent:#6fc1a9;--accent-ink:#0d1f1a;--danger:#f2b8b5;
  --shadow:0 1px 3px rgba(0,0,0,.5);color-scheme:dark;
}
:root[data-theme="sepia"]{
  --bg:#f1e6cf;--surface:#f8f0dd;--text:#3b2f20;--muted:#7a6850;--border:#dccfae;
  --accent:#8a5a2b;--accent-ink:#ffffff;--danger:#a23a1f;
  --shadow:0 1px 3px rgba(60,40,10,.15);color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- Perpustakaan ---------- */
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.top h1{font-size:1.25rem;margin:0;flex:1;letter-spacing:-.01em}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.97)}
.tools{display:flex;gap:8px;margin:4px 0 14px}
.tools input{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px}
.tools select{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 8px}
.stats{color:var(--muted);font-size:.85rem;margin:0 2px 12px}
.notice{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--danger);
  border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.resume{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow);width:100%;text-align:left}
.resume .mini{width:44px;height:60px;border-radius:6px;flex:none;
  background:linear-gradient(145deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 24%))}
.resume .rt{font-weight:700;line-height:1.25}
.resume .rs{color:var(--muted);font-size:.85rem;margin-top:2px}
.resume .go{margin-left:auto;color:var(--accent);font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:16px}
.card{display:flex;flex-direction:column;min-width:0}
.cover{position:relative;aspect-ratio:2/3;border:0;border-radius:6px 12px 12px 6px;padding:14px 12px 12px 16px;
  text-align:left;color:#fff;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(145deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 24%))}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22)}
.cover .ct{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1rem;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover .ca{position:absolute;left:16px;right:10px;bottom:30px;font-size:.72rem;opacity:.85;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .ext{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.35);border-radius:6px;
  padding:2px 6px;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
.meta{padding:8px 2px 0}
.meta .t{font-weight:650;font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.meta .a{color:var(--muted);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;background:var(--border);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.78rem}
.row button{border:0;background:none;padding:4px 8px;margin-right:-8px;font-size:1.1rem;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;border:2px dashed var(--border);border-radius:20px;color:var(--muted)}
.empty .big{font-size:2.6rem}
.empty h2{color:var(--text);margin:8px 0 6px;font-size:1.1rem}
.empty p{margin:0 0 16px;line-height:1.5}
.dropveil{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--accent) 88%,transparent);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;
  pointer-events:none}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:85%;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:1.05rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  z-index:90;background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90%;
  box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}

.cover.hascover{background-size:cover;background-position:center}
.cover.hascover .ct,.cover.hascover .ca{display:none}
.menurow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.menurow .btn{flex:1;min-width:140px;font-size:.88rem}
.crow{border-bottom:1px solid var(--border);padding:10px 0}
.crow .top2{display:flex;gap:8px;align-items:center}
.crow .n{color:var(--muted);font-size:.8rem;min-width:24px;text-align:right}
.crow input{flex:1;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:8px 10px}
.crow .tb{display:flex;gap:6px;margin:8px 0 0 32px;flex-wrap:wrap}
.crow .tb button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.82rem}
.crow .tb button[disabled]{opacity:.35}
.crow .tb button[data-a="del"]{color:var(--danger)}

.ibtn.bm{opacity:.45}.ibtn.bm.on{opacity:1}
.bmrow{display:flex;align-items:center;border-bottom:1px solid var(--border)}
.bmgo{flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 6px;line-height:1.35}
.bmgo small{display:block;color:var(--muted);margin-bottom:2px}
.bmdel,.hldel{border:0;background:none;color:var(--muted);padding:10px;font-size:1rem}
.muted{color:var(--muted);font-size:.88rem;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:8px}

.reader.just .rbody article p{text-align:justify;hyphens:auto}
mark.hl{color:inherit;border-radius:3px;padding:0 1px}
mark.hl.c1{background:rgba(245,215,66,.55)}mark.hl.c2{background:rgba(111,208,138,.5)}
mark.hl.c3{background:rgba(111,178,255,.5)}mark.hl.c4{background:rgba(255,143,191,.5)}
mark.hl.note{border-bottom:2px dotted var(--accent)}
.tts-cur{background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:4px}
#selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:35;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:6px 8px;display:flex;gap:8px;align-items:center}
#selBar .btn{padding:6px 10px}
.dotbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);padding:0}
.dotbtn.on{outline:3px solid var(--accent);outline-offset:1px}
.ibtn.on{color:var(--accent);background:var(--border)}
.bars{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0 14px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bfill{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bcol small{color:var(--muted);font-size:.7rem;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.92rem}

button.chip.sm{flex:none;min-width:0;padding:7px 12px;font-size:.84rem;border-radius:999px}
.fl{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.fl::-webkit-scrollbar{display:none}
.fav{position:absolute;top:6px;right:8px;color:#ffd54a;font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.chk{position:absolute;top:8px;left:14px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);
  color:#fff;display:none;align-items:center;justify-content:center;font-size:.9rem}
.selecting .chk{display:flex}
.card.sel .chk{background:var(--accent);border-color:var(--accent)}
.card.sel .cover{outline:3px solid var(--accent);outline-offset:2px}
.badge{display:inline-block;font-size:.68rem;padding:1px 6px;border-radius:6px;background:var(--border);color:var(--muted);margin-left:6px}
#bulkBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;overflow-x:auto}
#bulkBar .btn{flex:none;padding:8px 10px;font-size:.85rem}
#bulkBar .cnt{flex:none;font-weight:700;margin-right:4px}
.rbody article figure{margin:1em 0;text-align:center;break-inside:avoid}
.rbody article img{max-width:100%;max-height:62vh;height:auto;object-fit:contain;border-radius:4px}
/* ---------- Pembaca ---------- */
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  --fs:19px;--lh:1.7;--ff:Georgia,"Iowan Old Style","Times New Roman",serif}
.rbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-color:var(--border);border-style:solid;border-width:0}
.rbar.t{padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom-width:1px}
.rbar.b{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));border-top-width:1px;justify-content:space-between}
.ibtn{border:0;background:none;font-size:1.15rem;padding:8px 10px;border-radius:10px;min-width:40px}
.ibtn:active{background:var(--border)}
.rt{flex:1;min-width:0;text-align:center;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.rbody article{max-width:var(--mw,42rem);margin:0 auto;padding:22px var(--mx,20px) 60px;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);
  overflow-wrap:anywhere}
.rbody article h2{font-size:1.45em;line-height:1.25;margin:.3em 0 1em;text-align:center}
.rbody article h3{font-size:1.2em;margin:1.2em 0 .6em}
.rbody article p{margin:0 0 .9em;text-indent:1.4em;text-align:start}
.rbody article .ar{font-family:var(--arff,'Traditional Arabic','Amiri',serif);font-size:calc(1em * var(--ars,1.15));line-height:1;letter-spacing:0;word-spacing:normal}
.rbody article .arp{font-size:calc(1em * var(--ars,1.15));line-height:var(--arlh,1.9);text-indent:0}
.rbody article .arp .ar{font-size:1em;line-height:inherit}
.rbody article h2+p,.rbody article hr+p,.rbody article p.center{text-indent:0}
.rbody article p.center{text-align:center}
.rbody article hr{border:0;text-align:center;margin:1.6em 0}
.rbody article hr::after{content:"* * *";color:var(--muted);letter-spacing:.3em}
.rbody article blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.rbody article pre{overflow-x:auto;background:var(--surface);padding:12px;border-radius:8px;font-size:.8em}
.rbody article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.rbody article ul,.rbody article ol{padding-left:1.5em}
.rbody.paged{overflow:hidden;position:relative;touch-action:none}
.rbody.paged #clip{position:absolute;top:0;bottom:0;left:50%;overflow:hidden}
.rbody.paged article{max-width:none;margin:0;height:100%;padding:22px var(--px,20px);
  column-gap:calc(var(--px,20px) * 2);column-fill:auto;will-change:transform}
.rbody.paged article h2,.rbody.paged article h3{break-after:avoid}
.rbody.paged article p{orphans:2;widows:2}
.rprog{font-size:.8rem;color:var(--muted);text-align:center;flex:1}
.nav{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:600}
.nav[disabled]{opacity:.35}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;flex:1;min-width:70px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.setrow{margin-bottom:14px}
.setrow>label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 6px;border-bottom:1px solid var(--border);line-height:1.3}
.toc button.cur{color:var(--accent);font-weight:700}
.toc small{color:var(--muted);margin-right:8px}
</style>
</head>
<body>

<div class="wrap" id="lib">
  <div class="top">
    <h1>📚 Perpustakaan Novel</h1>
    <button class="btn" id="setBtn" aria-label="Data dan cadangan">⚙</button>
    <button class="btn primary" id="addBtn">＋ Tambah</button>
  </div>
  <div id="warn"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari judul atau penulis…" autocomplete="off">
    <select id="sort" aria-label="Urutkan">
      <option value="read">Terakhir dibaca</option>
      <option value="added">Terbaru ditambah</option>
      <option value="title">Judul A–Z</option>
    </select>
  </div>
  <div class="fl" id="stChips"></div>
  <div class="tools">
    <select id="fColl" aria-label="Koleksi"><option value="">Semua koleksi</option></select>
    <select id="fTag" aria-label="Tag"><option value="">Semua tag</option></select>
    <button class="btn" id="selMode">☑ Pilih</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="resume"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <div class="big">📖</div>
    <h2>Perpustakaanmu masih kosong</h2>
    <p>Unggah novel berformat <b>.txt</b>, <b>.docx</b>, <b>.md</b>, <b>.epub</b>, <b>.pdf</b>, <b>.chm</b>, <b>.fb2</b>, <b>.html</b>, <b>.rtf</b>, atau <b>.mobi/.azw3</b>.<br>Punya cadangan <b>.json</b>? Unggah juga di sini.<br>Semua diproses &amp; disimpan di perangkat ini, tanpa server.</p>
    <button class="btn primary" id="addBtn2">Pilih file novel</button>
  </div>
  <input type="file" id="coverFile" accept="image/*" hidden>
  <input type="file" id="chapFile" accept=".txt,.md,.markdown,.docx" hidden>
  <input type="file" id="file" multiple accept=".txt,.md,.markdown,.docx,.epub,.chm,.pdf,.fb2,.html,.htm,.rtf,.mobi,.azw,.azw3,.prc,.json,text/plain,application/pdf,text/markdown,application/epub+zip,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
</div>

<section class="reader" id="reader" hidden>
  <div class="rbar t">
    <button class="ibtn" id="rBack" aria-label="Kembali">←</button>
    <div class="rt" id="rTitle"></div>
    <button class="ibtn" id="rTts" aria-label="Baca nyaring">🔊</button>
    <button class="ibtn bm" id="rBm" aria-label="Tandai halaman">🔖</button>
    <button class="ibtn" id="rToc" aria-label="Daftar bab dan penanda">☰</button>
    <button class="ibtn" id="rSet" aria-label="Tampilan">Aa</button>
  </div>
  <div class="rbody" id="rBody"><div id="clip"><article id="rText"></article></div></div>
  <div class="rbar b">
    <button class="nav" id="rPrev" aria-label="Bab sebelumnya">‹ Bab</button>
    <div class="rprog" id="rProg"></div>
    <button class="nav" id="rNext" aria-label="Bab berikutnya">Bab ›</button>
  </div>
</section>

<div id="bulkBar" hidden></div>
<div id="selBar" hidden>
  <button class="dotbtn" data-c="1" style="background:#f5d742" aria-label="Sorot kuning"></button>
  <button class="dotbtn" data-c="2" style="background:#6fd08a" aria-label="Sorot hijau"></button>
  <button class="dotbtn" data-c="3" style="background:#6fb2ff" aria-label="Sorot biru"></button>
  <button class="dotbtn" data-c="4" style="background:#ff8fbf" aria-label="Sorot merah muda"></button>
  <button class="btn" id="selNote" aria-label="Tambah catatan">📝</button>
  <button class="btn" id="selCopy" aria-label="Salin">⧉</button>
</div>
<div id="modalRoot"></div>
<div class="dropveil" id="veil" hidden>Lepaskan file untuk menambahkan</div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const words=t=>(t.match(/\S+/g)||[]).length;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nf=n=>n>=10000?Math.round(n/1000)+' rb':n.toLocaleString('id-ID');
function hue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360;}

/* ---------- Penyimpanan (IndexedDB, cadangan: memori) ---------- */
const mem={meta:new Map(),content:new Map()};
let idb=null;
function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('perpus-novel-offline',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('content',{keyPath:'id'});};
      r.onsuccess=()=>{idb=r.result;res(true);};
      r.onerror=()=>res(false);
      r.onblocked=()=>res(false);
    }catch(e){res(false);}
  });
}
function tx(store,mode,fn){
  return new Promise((resolve,reject)=>{
    const t=idb.transaction(store,mode);
    const rq=fn(t.objectStore(store));
    t.oncomplete=()=>resolve(rq&&rq.result);
    t.onerror=()=>reject(t.error);
    t.onabort=()=>reject(t.error);
  });
}
const dbAll=async s=>idb?await tx(s,'readonly',o=>o.getAll()):[...mem[s].values()];
const dbGet=async(s,id)=>idb?await tx(s,'readonly',o=>o.get(id)):mem[s].get(id);
const dbPut=async(s,v)=>{if(idb)await tx(s,'readwrite',o=>o.put(v));else mem[s].set(v.id,v);};

/* ---------- Parser: ZIP / DOCX ---------- */
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('Bukan file DOCX yang valid');
  const count=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);
  const files={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
    files[name]={method,csize,lho};
    off+=46+nlen+elen+clen;
  }
  return {files,u8,dv};
}
async function readBytes(z,name){
  let f=z.files[name];
  if(!f){const k=Object.keys(z.files).find(x=>x.toLowerCase()===String(name).toLowerCase());f=k&&z.files[k];}
  if(!f)return null;
  const lo=f.lho,nlen=z.dv.getUint16(lo+26,true),elen=z.dv.getUint16(lo+28,true);
  const start=lo+30+nlen+elen,data=z.u8.subarray(start,start+f.csize);
  if(f.method===0)return data.slice();
  if(typeof DecompressionStream==='undefined')throw new Error('Browser ini belum mendukung pembacaan file ZIP (DOCX/EPUB)');
  const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readEntry(z,name){
  const b=await readBytes(z,name);
  return b?new TextDecoder().decode(b):null;
}
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const HEAD_RE=/^(bab|chapter|bagian|part|prolog|epilog|prologue|epilogue|kata pengantar|pendahuluan|interlude|extra)\b[\s\dIVXLCivxlc.:\-–—]*.{0,70}$/i;
const looksHeading=t=>t.length<=80&&HEAD_RE.test(t);

async function parseDocx(buf){
  const z=await unzip(buf);
  const xml=await readEntry(z,'word/document.xml');
  if(!xml)throw new Error('Isi dokumen tidak ditemukan');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Dokumen rusak');
  const rels={},budget={n:0};
  try{
    const rx=await readEntry(z,'word/_rels/document.xml.rels');
    if(rx){const rd=new DOMParser().parseFromString(rx,'application/xml');for(const r of rd.getElementsByTagName('Relationship'))rels[r.getAttribute('Id')]=r.getAttribute('Target');}
  }catch(e){}
  const blocks=[];
  for(const p of doc.getElementsByTagNameNS(W,'p')){
    let style='',center=false;
    const pPr=p.getElementsByTagNameNS(W,'pPr')[0];
    if(pPr){
      const st=pPr.getElementsByTagNameNS(W,'pStyle')[0];
      style=st?(st.getAttributeNS(W,'val')||''):'';
      const jc=pPr.getElementsByTagNameNS(W,'jc')[0];
      center=!!jc&&jc.getAttributeNS(W,'val')==='center';
    }
    let html='',text='';
    for(const r of p.getElementsByTagNameNS(W,'r')){
      let b=false,i=false;
      const rPr=r.getElementsByTagNameNS(W,'rPr')[0];
      if(rPr){
        const bb=rPr.getElementsByTagNameNS(W,'b')[0],ii=rPr.getElementsByTagNameNS(W,'i')[0];
        b=!!bb&&!['0','false'].includes(bb.getAttributeNS(W,'val'));
        i=!!ii&&!['0','false'].includes(ii.getAttributeNS(W,'val'));
      }
      let t='';
      for(const n of r.childNodes){
        if(n.localName==='t')t+=n.textContent;
        else if(n.localName==='tab')t+='\t';
        else if(n.localName==='br'||n.localName==='cr')t+='\n';
      }
      if(!t)continue;
      text+=t;
      let h=esc(t).replace(/\n/g,'<br>').replace(/\t/g,'&emsp;');
      if(i)h='<em>'+h+'</em>';
      if(b)h='<strong>'+h+'</strong>';
      html+=h;
    }
    const clean=text.trim();
    const imgB=await docxImages(p,z,rels,budget);
    if(!clean){imgB.forEach(b=>blocks.push(b));continue;}
    const hm=style.match(/^(heading|judul|title|subtitle)\s*(\d)?/i);
    if(hm){
      let lvl=hm[2]?Math.min(+hm[2],3):1;
      if(/^subtitle/i.test(hm[1]))lvl=2;
      blocks.push({k:'h',lvl,html:esc(clean),text:clean});
    }else if(looksHeading(clean)){
      blocks.push({k:'h',lvl:1,html:esc(clean),text:clean});
    }else{
      blocks.push({k:'p',html:html.trim(),text:clean,cls:center?'center':''});
    }
    imgB.forEach(b=>blocks.push(b));
  }
  let title='',author='';
  try{
    const core=await readEntry(z,'docProps/core.xml');
    if(core){
      const cd=new DOMParser().parseFromString(core,'application/xml');
      title=(cd.getElementsByTagName('dc:title')[0]||{}).textContent||'';
      author=(cd.getElementsByTagName('dc:creator')[0]||{}).textContent||'';
    }
  }catch(e){}
  return {blocks,title:title.trim(),author:author.trim()};
}

/* ---------- Parser: TXT ---------- */
function parseTxt(src){
  src=src.replace(/\r\n?/g,'\n');
  const blankSep=(src.match(/\n[ \t]*\n/g)||[]).length>3;
  const paras=blankSep
    ?src.split(/\n[ \t]*\n+/).map(p=>p.replace(/\s*\n\s*/g,' ').trim())
    :src.split('\n').map(p=>p.trim());
  const blocks=paras.filter(Boolean).map(t=>looksHeading(t)
    ?{k:'h',lvl:1,html:esc(t),text:t}
    :{k:'p',html:esc(t),text:t,cls:''});
  return {blocks};
}

/* ---------- Parser: Markdown ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1');
  s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1');
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*|__(.+?)__/g,(m,a,b)=>'<strong>'+(a||b)+'</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/(^|[\s(])_(.+?)_(?=[\s).,!?;:]|$)/g,'$1<em>$2</em>');
  return s;
}
function parseMd(src){
  const lines=src.replace(/\r\n?/g,'\n').split('\n'),blocks=[];
  let para=[];
  const flush=()=>{
    if(para.length){const t=para.join(' ').trim();if(t)blocks.push({k:'p',html:inline(t),text:t,cls:''});para=[];}
  };
  const LI=/^\s*([-*+]|\d+[.)])\s+/;
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];let m;
    if(/^\s*```/.test(ln)){
      flush();const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}
      blocks.push({k:'html',html:'<pre><code>'+esc(buf.join('\n'))+'</code></pre>',text:buf.join(' ')});
      continue;
    }
    if((m=ln.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){
      flush();
      blocks.push({k:'h',lvl:m[1].length<=2?m[1].length:3,html:inline(m[2]),text:m[2]});
      continue;
    }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){flush();blocks.push({k:'html',html:'<hr>',text:''});continue;}
    if(/^\s*>/.test(ln)){
      flush();const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      i--;const t=buf.join(' ').trim();
      blocks.push({k:'html',html:'<blockquote>'+inline(t)+'</blockquote>',text:t});
      continue;
    }
    if(LI.test(ln)){
      flush();const ordered=/^\s*\d/.test(ln),items=[];
      while(i<lines.length&&LI.test(lines[i])){items.push(lines[i].replace(LI,''));i++;}
      i--;const tag=ordered?'ol':'ul';
      blocks.push({k:'html',html:'<'+tag+'>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+tag+'>',text:items.join(' ')});
      continue;
    }
    if(!ln.trim()){flush();continue;}
    para.push(ln.trim());
  }
  flush();
  return {blocks};
}

/* ---------- Bab ---------- */
function renderBlock(b){
  if(b.k==='h')return '<h'+(b.lvl>=3?3:2)+'>'+b.html+'</h'+(b.lvl>=3?3:2)+'>';
  if(b.k==='p')return '<p'+(b.cls?' class="'+b.cls+'"':'')+'>'+b.html+'</p>';
  return b.html;
}
function buildChapters(blocks,bookTitle){
  const chs=[];let cur={title:null,parts:[],blocks:[]};
  const push=()=>{
    if(cur.parts.length)chs.push({title:cur.title||(chs.length?'Bagian '+(chs.length+1):'Pembuka'),parts:cur.parts,blocks:cur.blocks});
  };
  for(const b of blocks){
    if(b.k==='h'&&b.lvl<=2){push();cur={title:b.text.slice(0,120),parts:[renderBlock(b)],blocks:[b]};}
    else{cur.parts.push(renderBlock(b));cur.blocks.push(b);}
  }
  push();
  let out=[];
  if(chs.length===1&&words(blocks.map(b=>b.text).join(' '))>8000){
    const only=chs[0],per=4000;let acc=[],w=0,n=1;
    const flushPart=()=>{if(acc.length){out.push({title:(n===1&&only.title!=='Pembuka'?only.title:'Bagian '+n),html:acc.join('')});n++;acc=[];w=0;}};
    only.blocks.forEach((b,i)=>{acc.push(only.parts[i]);w+=words(b.text);if(w>=per)flushPart();});
    flushPart();
    if(out.length>1)out[0].title=only.title==='Pembuka'?'Bagian 1':only.title;
  }else{
    out=chs.map(c=>({title:c.title,html:c.parts.join('')}));
  }
  if(out.length===1&&out[0].title==='Pembuka')out[0].title=bookTitle;
  return out;
}

/*LZX-BEGIN*/
const LZX_SLOTS=[30,32,34,36,38,42,50];
const LZX_EXTRA=[],LZX_BASE=[];
(function(){
  let j=0;
  for(let i=0;i<=50;i+=2){LZX_EXTRA[i]=LZX_EXTRA[i+1]=j;if(i!==0&&j<17)j++;}
  let b=0;
  for(let i=0;i<=51;i++){LZX_BASE[i]=b;b+=Math.pow(2,LZX_EXTRA[i]);}
})();
const POW2=[];for(let i=0;i<=52;i++)POW2[i]=Math.pow(2,i);

function lzxTable(lens,n){
  let max=0;
  for(let i=0;i<n;i++)if(lens[i]>max)max=lens[i];
  if(max===0)return {max:0,tab:null};
  if(max>16)throw new Error('LZX: panjang kode tidak valid');
  const count=new Array(max+1).fill(0);
  for(let i=0;i<n;i++)if(lens[i])count[lens[i]]++;
  const next=new Array(max+2).fill(0);
  let code=0;
  for(let l=1;l<=max;l++){code=(code+count[l-1])*2;next[l]=code;}
  const tab=new Int32Array(1<<max);
  for(let s=0;s<n;s++){
    const l=lens[s];if(!l)continue;
    const c=next[l]++;
    if(c>=POW2[l])throw new Error('LZX: pohon Huffman melebihi batas');
    const sh=max-l;
    tab.fill(s*32+l,c*POW2[sh],(c+1)*POW2[sh]);
  }
  return {max,tab};
}

/* Dekompresi aliran LZX milik CHM. Setiap "frame" = 32768 byte keluaran;
   status dikembalikan ke awal tiap resetFrames frame, pada offset terkompresi offs[frame]. */
function lzxDecode(src,outLen,windowBits,resetFrames,offs){
  const FR=32768;
  const posSlots=LZX_SLOTS[windowBits-15];
  if(!posSlots)throw new Error('LZX: ukuran jendela tidak didukung ('+windowBits+')');
  const mainN=256+posSlots*8;
  const out=new Uint8Array(outLen);
  let pos=0,bitBuf=0,bitsLeft=0;

  const ensure=n=>{
    while(bitsLeft<n){
      if(pos>src.length+64)throw new Error('LZX: data terkompresi habis (file rusak?)');
      const w=pos+1<src.length?(src[pos]|(src[pos+1]<<8)):0;
      pos+=2;bitBuf=bitBuf*65536+w;bitsLeft+=16;
    }
  };
  const drop=n=>{bitsLeft-=n;bitBuf=bitBuf%POW2[bitsLeft];};
  const bits=n=>{
    if(n===0)return 0;
    ensure(n);
    const v=Math.floor(bitBuf/POW2[bitsLeft-n])%POW2[n];
    drop(n);return v;
  };
  const sym=t=>{
    if(!t.max)throw new Error('LZX: pohon kosong');
    ensure(t.max);
    const v=t.tab[Math.floor(bitBuf/POW2[bitsLeft-t.max])%POW2[t.max]];
    if(!v)throw new Error('LZX: kode Huffman tidak valid');
    drop(v&31);return v>>5;
  };

  const mainLens=new Uint8Array(mainN),lenLens=new Uint8Array(249),alignLens=new Uint8Array(8);
  let mainT=null,lenT=null,alignT=null;
  let R0=1,R1=1,R2=1,blockType=0,blockLength=0,blockRemaining=0,headerRead=false,intelFilesize=0;

  const readLens=(lens,first,last)=>{
    const pl=new Uint8Array(20);
    for(let i=0;i<20;i++)pl[i]=bits(4);
    const pt=lzxTable(pl,20);
    for(let x=first;x<last;){
      let z=sym(pt);
      if(z===17){let y=bits(4)+4;while(y--&&x<last)lens[x++]=0;}
      else if(z===18){let y=bits(5)+20;while(y--&&x<last)lens[x++]=0;}
      else if(z===19){
        let y=bits(1)+4;z=sym(pt);z=lens[x]-z;if(z<0)z+=17;
        while(y--&&x<last)lens[x++]=z;
      }else{z=lens[x]-z;if(z<0)z+=17;lens[x++]=z;}
    }
  };
  const resetState=()=>{
    R0=R1=R2=1;blockType=0;blockRemaining=0;blockLength=0;headerRead=false;
    mainLens.fill(0);lenLens.fill(0);
  };
  const u32=p=>(src[p]|(src[p+1]<<8)|(src[p+2]<<16)|(src[p+3]<<24))>>>0;
  const readBlockHeader=()=>{
    if(!headerRead){
      intelFilesize=0;
      if(bits(1)){const hi=bits(16),lo=bits(16);intelFilesize=hi*65536+lo;}
      headerRead=true;
    }
    blockType=bits(3);
    const hi=bits(16),lo=bits(8);
    blockLength=blockRemaining=hi*256+lo;
    if(blockType===2){
      for(let i=0;i<8;i++)alignLens[i]=bits(3);
      alignT=lzxTable(alignLens,8);
    }
    if(blockType===1||blockType===2){
      readLens(mainLens,0,256);
      readLens(mainLens,256,mainN);
      readLens(lenLens,0,249);
      mainT=lzxTable(mainLens,mainN);
      lenT=lzxTable(lenLens,249);
    }else if(blockType===3){
      if(bitsLeft===0)pos+=2;
      bitBuf=0;bitsLeft=0;
      R0=u32(pos);R1=u32(pos+4);R2=u32(pos+8);pos+=12;
    }else throw new Error('LZX: tipe blok tidak dikenal');
  };
  const e8=(fs,fe)=>{
    let cur=fs;const end=fe-10;
    for(let i=fs;i<end;){
      if(out[i++]!==0xE8){cur++;continue;}
      const abs=out[i]|(out[i+1]<<8)|(out[i+2]<<16)|(out[i+3]<<24);
      if(abs>=-cur&&abs<intelFilesize){
        const rel=abs>=0?abs-cur:abs+intelFilesize;
        out[i]=rel&255;out[i+1]=(rel>>8)&255;out[i+2]=(rel>>16)&255;out[i+3]=(rel>>24)&255;
      }
      i+=4;cur+=5;
    }
  };

  const nFrames=Math.ceil(outLen/FR);
  let outPos=0;
  for(let f=0;f<nFrames;f++){
    if(f%resetFrames===0){
      if(offs[f]===undefined)throw new Error('LZX: tabel reset tidak lengkap');
      resetState();pos=offs[f];bitBuf=0;bitsLeft=0;
    }
    const fs=f*FR,fe=Math.min(fs+FR,outLen);
    while(outPos<fe){
      if(blockRemaining===0)readBlockHeader();
      const run=Math.min(blockRemaining,fe-outPos);
      if(blockType===3){
        out.set(src.subarray(pos,pos+run),outPos);
        pos+=run;outPos+=run;blockRemaining-=run;
        if(blockRemaining===0&&(blockLength&1))pos++;
        continue;
      }
      let made=0;
      while(made<run){
        const me=sym(mainT);
        if(me<256){out[outPos++]=me;made++;continue;}
        const m=me-256;
        let len=m&7;
        if(len===7)len+=sym(lenT);
        len+=2;
        const slot=m>>3;
        let off;
        if(slot===0)off=R0;
        else if(slot===1){off=R1;R1=R0;R0=off;}
        else if(slot===2){off=R2;R2=R0;R0=off;}
        else{
          const extra=LZX_EXTRA[slot]===undefined?17:LZX_EXTRA[slot];
          off=LZX_BASE[slot]-2;
          if(blockType===2){
            if(extra>3){off+=bits(extra-3)*8;off+=sym(alignT);}
            else if(extra===3)off+=sym(alignT);
            else if(extra>0)off+=bits(extra);
            else off=1;
          }else{
            if(extra>0)off+=bits(extra);else off=1;
          }
          R2=R1;R1=R0;R0=off;
        }
        let from=outPos-off;
        if(from<0)throw new Error('LZX: referensi di luar jendela (file rusak?)');
        if(outPos+len>outLen)len=outLen-outPos;
        for(let k=0;k<len;k++)out[outPos+k]=out[from+k];
        outPos+=len;made+=len;
      }
      if(made>blockRemaining)throw new Error('LZX: blok melebihi panjangnya');
      blockRemaining-=made;
    }
    /* rata ke batas 16 bit di akhir setiap frame */
    if(bitsLeft%16)drop(bitsLeft%16);
    if(intelFilesize&&fe-fs>10)e8(fs,fe);
  }
  return out;
}

/* ---- Kontainer CHM (ITSF/ITSP/PMGL) ---- */
function chmParse(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const u32=o=>dv.getUint32(o,true);
  const u64=o=>dv.getUint32(o,true)+dv.getUint32(o+4,true)*4294967296;
  const tag=(o,n)=>String.fromCharCode(...u8.subarray(o,o+n));
  if(u8.length<0x60||tag(0,4)!=='ITSF')throw new Error('Bukan file CHM yang valid');
  const ver=u32(4);
  const dirOff=u64(0x48),dirLen=u64(0x50);
  const dataOff=ver>=3?u64(0x58):dirOff+dirLen;
  if(tag(dirOff,4)!=='ITSP')throw new Error('Direktori CHM tidak ditemukan');
  const hdrLen=u32(dirOff+8),chunkSize=u32(dirOff+0x10),numChunks=u32(dirOff+0x2C);
  const entries=new Map();
  const td=new TextDecoder('utf-8');
  for(let c=0;c<numChunks;c++){
    const base=dirOff+hdrLen+c*chunkSize;
    if(base+chunkSize>u8.length||tag(base,4)!=='PMGL')continue;
    const nEnt=dv.getUint16(base+chunkSize-2,true);
    let p=base+0x14;
    const enc=()=>{let v=0,b;do{b=u8[p++];v=v*128+(b&127);}while(b&128);return v;};
    for(let e=0;e<nEnt;e++){
      const nl=enc();
      const name=td.decode(u8.subarray(p,p+nl));p+=nl;

function lcidCharset(lcid){

    0x19:'windows-1251',0x22:'windows-1251',0x23:'windows-1251',0x02:'windows-1251',0x1E:'windows-874',0x2A:'windows-1258',
    0x15:'windows-1250',0x0E:'windows-1250',0x05:'windows-1250',0x08:'windows-1253',0x1F:'windows-1254'};

}

  let r;

  if(!opt.noMeta){
    const head=new TextDecoder('latin1').decode(u8.subarray(0,Math.min(u8.length,4096)));

  if(opt.hint){r=tryDec(opt.hint);if(r!==null)return r;}

    if(n.nodeType===3)return esc(n.nodeValue.replace(/\s+/g,' '));
    if(n.nodeType!==1)return '';
    const t=n.localName.toLowerCase();
    if(SKIP_TAGS.has(t))return '';
    if(t==='br')return '<br>';
    const inner=inlKids(n);
    if(t==='b'||t==='strong')return '<strong>'+inner+'</strong>';
    if(t==='i'||t==='em'||t==='cite'||t==='dfn')return '<em>'+inner+'</em>';
    if(t==='sup'||t==='sub')return '<'+t+'>'+inner+'</'+t+'>';
    if(t==='p'||t==='div'||t==='li'||t==='tr')return inner+'<br>';

  };

      if(n.nodeType!==1)continue;
      const t=n.localName.toLowerCase();
      if(SKIP_TAGS.has(t))continue;
      if(/^h[1-6]$/.test(t)){
        flush();
        const tx=n.textContent.replace(/\s+/g,' ').trim();
        if(tx)blocks.push({k:'h',lvl:Math.min(+t[1],3),html:trim(inlKids(n)),text:tx});
      }else if(t==='img'){
        flush();
        const src=n.getAttribute('src')||'';
        if(/^data:image\/(jpeg|png|gif|webp);base64,/i.test(src))blocks.push({k:'html',html:'<figure class="fig"><img src="'+esc(src)+'" alt="'+esc(n.getAttribute('alt')||'')+'"></figure>',text:'',img:true});
      }else if(t==='p'&&n.getElementsByTagName('img').length){flush();walk(n);flush();}
      else if(t==='p'){flush();buf=inlKids(n);flush();}
      else if(t==='blockquote'){

        if(h.replace(/<[^>]*>/g,'').trim())blocks.push({k:'html',html:'<blockquote>'+h+'</blockquote>',text:n.textContent});
      }else if(t==='ul'||t==='ol'){
        flush();

        if(items.length)blocks.push({k:'html',html:'<'+t+'>'+items.join('')+'</'+t+'>',text:n.textContent});
      }else if(t==='pre'){flush();blocks.push({k:'html',html:'<pre><code>'+esc(n.textContent)+'</code></pre>',text:n.textContent});}
      else if(t==='hr'){flush();blocks.push({k:'html',html:'<hr>',text:''});}

        }

      else buf+=inlNode(n);
    }
  };
  walk(root);flush();

}

const OK_TAGS=new Set(['h2','h3','p','em','strong','br','hr','blockquote','ul','ol','li','pre','code','sup','sub','figure']);
function cleanNode(n){
  let h='';

    if(c.nodeType===3){h+=esc(c.nodeValue);continue;}
    if(c.nodeType!==1)continue;
    const t=c.localName.toLowerCase();
    if(['script','style','iframe','object','embed','svg','math','template'].includes(t))continue;
    if(t==='img'){
      const src=c.getAttribute('src')||'';
      if(/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(src)&&src.length<4000000)h+='<img src="'+src+'" alt="'+esc(c.getAttribute('alt')||'')+'">';

function resolvePath(base,href){
  href=String(href||'').split('#')[0].split('?')[0];
  try{href=decodeURIComponent(href);}catch(e){}
  const dir=base?base.split('/').slice(0,-1):[];
  const parts=(href.startsWith('/')?[]:dir).concat(href.split('/'));
  const out=[];
  for(const p of parts){if(p===''||p==='.')continue;if(p==='..')out.pop();else out.push(p);}
  return out.join('/');
}

}

async function parseChm(buf){

async function parsePdf(buf){

        if(l<8)break;
        const data=r0.subarray(p+8,p+l);
        if(t===100&&!author)author=td.decode(data);
        else if(t===503)title=td.decode(data);
        else if(t===201&&data.length>=4)coverOff=new DataView(data.buffer,data.byteOffset,4).getUint32(0,false);
        p+=l;
      }
    }
  }
  const parts=[];
  for(let i=1;i<=recCount&&i<n;i++){
    let data=rec(i);
    if(flags){const tr=mobiTrail(data,flags);if(tr>0&&tr<data.length)data=data.subarray(0,data.length-tr);}
    parts.push(comp===2?palmDecompress(data):data);
  }
  const total=parts.reduce((a,p)=>a+p.length,0),text=new Uint8Array(total);
  let q=0;for(const p of parts){text.set(p,q);q+=p.length;}
  const html=new TextDecoder(enc===65001?'utf-8':'windows-1252').decode(text.subarray(0,textLen?Math.min(total,textLen):total));
  return {html,title:title.trim(),author:author.trim(),version,rec,firstImg,coverOff};
}
/*MOBI-END*/
async function parseMobi(buf){
  const m=mobiExtract(buf);
  let html=m.html.replace(/<mbp:pagebreak[^>]*>/gi,'<hr class="pb">').replace(/<\/?mbp:[^>]*>/gi,'')
    .replace(/<img\b[^>]*?recindex=["']?(\d+)["']?[^>]*>/gi,(t,k)=>'<img src="@rec:'+parseInt(k,10)+'">');
  const budget={n:0};
  const ok=m.firstImg>0&&m.firstImg!==0xFFFFFFFF;
  const resolve=async src=>{const mm=/^@rec:(\d+)$/.exec(src);return mm&&ok?m.rec(m.firstImg+parseInt(mm[1],10)-1):null;};
  let cover='';
  try{
    if(ok&&m.coverOff>=0){const b=m.rec(m.firstImg+m.coverOff),t=b?sniffType(b):null;if(t)cover=await makeCover(new Blob([b],{type:t}));}
  }catch(e){}
  const segs=html.split(/<hr class="pb">/),all=[],chapters=[];let words=0;
  for(let i=0;i<segs.length;i++){
    const d=new DOMParser().parseFromString(segs[i],'text/html');
    await inlineImages(d.body,resolve,budget);
    const blocks=domToBlocks(d.body);
    if(!blocks.length)continue;
    all.push(...blocks);
    const tw=wordsOf(blocks);
    if(tw<3&&!blocks.some(b=>b.img))continue;
    const h0=blocks.find(b=>b.k==='h');
    chapters.push({title:(h0?h0.text.slice(0,120):'Bagian '+(chapters.length+1)),html:blocks.map(renderBlock).join(''),w:tw});
    words+=tw;
    if(i%20===0)await tick();
  }
  if(!all.length)throw new Error('Tidak ada teks yang bisa dibaca di file ini');
  if(chapters.length>=2)return {chapters,title:m.title,author:m.author,cover,words};
  return {blocks:all,title:m.title,author:m.author,cover};
}

/* ---------- Impor ---------- */
const baseName=n=>n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim()||'Tanpa judul';
const extOf=n=>{const e=(n.split('.').pop()||'').toLowerCase();return e==='markdown'?'md':e;};
const wordsOf=blocks=>blocks.reduce((a,b)=>a+words(b.text),0);
const byName=(a,b)=>a.name.localeCompare(b.name,'id',{numeric:true,sensitivity:'base'});
const tick=()=>new Promise(r=>setTimeout(r,0));
let appendTarget=null;

async function parseFile(file){
  const ext=extOf(file.name);
  let res;
  if(ext==='txt')res=parseTxt(decodeText(new Uint8Array(await file.arrayBuffer()),{noMeta:true}));
  else if(ext==='md')res=parseMd(decodeText(new Uint8Array(await file.arrayBuffer()),{noMeta:true}));
  else if(ext==='docx')res=await parseDocx(await file.arrayBuffer());
  else if(ext==='epub')res=await parseEpub(await file.arrayBuffer());
  else if(ext==='chm')res=await parseChm(await file.arrayBuffer());
  else if(ext==='pdf')res=await parsePdf(await file.arrayBuffer());
  else if(ext==='fb2')res=await parseFb2(await file.arrayBuffer());
  else if(ext==='html'||ext==='htm'||ext==='xhtml')res=await parseHtmlFile(await file.arrayBuffer());
  else if(ext==='rtf')res=await parseRtf(await file.arrayBuffer());
  else if(['mobi','azw','azw3','prc'].includes(ext))res=await parseMobi(await file.arrayBuffer());
  else throw new Error('Format .'+ext+' tidak didukung');
  if(!(res.chapters?res.chapters.length:res.blocks.length))throw new Error('File kosong / tidak ada teks');
  res.ext=ext;
  return res;
}
async function saveNewBook(title,author,ext,size,chapters,totalWords,cover){
  const dup=findDup(title,totalWords,size);
  if(dup&&(await dupDecision(title,dup))==='skip')return null;
  const meta={id:uid(),title,author:author||'',ext,size,words:totalWords,chapters:chapters.length,
    added:Date.now(),lastRead:0,ch:0,pos:0,bookmarks:[]};
  if(cover)meta.cover=cover;
  await dbPut('content',{id:meta.id,chapters});
  await dbPut('meta',meta);
  books.push(meta);
  return meta;
}
async function importFile(file){
  const res=await parseFile(file);
  const title=res.title||baseName(file.name);
  return await saveNewBook(title,res.author,res.ext,file.size,chaptersOf(res,title),wordsOfRes(res),res.cover);
}
/* Gabungkan beberapa file (satu file = satu bab atau lebih) menjadi satu novel */
async function mergeFiles(files,title){
  files=[...files].sort(byName);dupPolicy=null;
  const chapters=[],errs=[],exts=new Set();
  let w=0,size=0,author='',cover='';
  for(let i=0;i<files.length;i++){
    toast('Menggabungkan '+(i+1)+'/'+files.length+'…',0);
    try{
      const res=await parseFile(files[i]);
      chapters.push(...chaptersOf(res,baseName(files[i].name)));
      w+=wordsOfRes(res);size+=files[i].size;exts.add(res.ext);
      if(!cover&&res.cover)cover=res.cover;
      if(!author&&res.author)author=res.author;
    }catch(e){errs.push(files[i].name+' ('+(e.message||'gagal')+')');}
    await tick();
  }
  if(!chapters.length)throw new Error(errs.join('; ')||'Tidak ada file yang bisa dibaca');
  await saveNewBook(title,author,exts.size===1?[...exts][0]:'gabungan',size,chapters,w,cover);
  return errs;
}
/* Tambahkan bab dari file ke buku yang sudah ada */
async function appendFiles(id,files){
  const meta=books.find(x=>x.id===id);if(!meta)return;
  const c=await dbGet('content',id);if(!c){toast('Isi buku tidak ditemukan');return;}
  files=[...files].sort(byName);
  const errs=[];let added=0;
  for(let i=0;i<files.length;i++){
    toast('Menambah '+(i+1)+'/'+files.length+'…',0);
    try{
      const res=await parseFile(files[i]);
      const chs=chaptersOf(res,baseName(files[i].name));
      c.chapters.push(...chs);added+=chs.length;
      meta.words+=wordsOfRes(res);meta.size+=files[i].size;
    }catch(e){errs.push(files[i].name+' ('+(e.message||'gagal')+')');}
    await tick();
  }
  if(added){meta.chapters=c.chapters.length;await dbPut('content',c);await dbPut('meta',meta);}
  renderLib();
  if(errs.length)toast((added?added+' bab ditambahkan. ':'')+'Gagal: '+errs.join('; '),6000);
  else toast(added+' bab ditambahkan ke "'+meta.title+'" ✓');
}
async function importSeparate(files){
  let ok=0,skipped=0;const errs=[];dupPolicy=null;
  for(let i=0;i<files.length;i++){
    toast('Memproses '+(i+1)+'/'+files.length+': '+files[i].name,0);
    try{if(await importFile(files[i]))ok++;else skipped++;}catch(e){errs.push(files[i].name+' ('+(e.message||'gagal')+')');}
    await tick();
  }
  renderLib();
  if(errs.length)toast((ok?ok+' buku ditambahkan. ':'')+'Gagal: '+errs.join('; '),6000);
  else toast(ok+' buku ditambahkan ✓'+(skipped?' · '+skipped+' duplikat dilewati':''));
}

      }catch(e){toast(e.message||'Gagal menggabungkan',5000);}
    };
  });
}
async function importFiles(list){
  const all=[...list];if(!all.length)return;
  const js=all.filter(f=>extOf(f.name)==='json'),files=all.filter(f=>extOf(f.name)!=='json');
  for(const f of js){
    try{const r=await importBackup(f);renderLib();toast(r,5000);}
    catch(e){toast(e.message||'Gagal membaca cadangan',5000);}
  }
  if(!files.length)return;
  if(files.length>1){askMulti(files);return;}
  await importSeparate(files);
}

/* ---------- Status, favorit, koleksi, tag ---------- */
function bookStatus(b){
  if(b.done||pct(b)>=98)return 'done';
  if(b.lastRead||pct(b)>0)return 'reading';
  return 'new';
}
const STATUS_LABEL={all:'Semua',fav:'★ Favorit',new:'Belum dibaca',reading:'Sedang dibaca',done:'Selesai'};
const filt={status:'all',coll:'',tag:''};
let selecting=false;const sel=new Set();
const normT=t=>String(t).toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,'');
const parseTags=v=>[...new Set(String(v||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>x.slice(0,30)))].slice(0,12);
function findDup(title,words,size){
  const nt=normT(title);
  return books.find(b=>normT(b.title)===nt&&(b.size===size||Math.abs(b.words-words)/Math.max(1,Math.max(b.words,words))<=0.05));
}
let dupPolicy=null;
function dupDecision(title,dup){
  if(dupPolicy==='all')return Promise.resolve('add');
  if(dupPolicy==='skip')return Promise.resolve('skip');
  return new Promise(res=>{
    openModal('<h3>Buku mirip sudah ada</h3>'+
      '<p style="line-height:1.5;margin:0 0 12px">“'+esc(title)+'” tampaknya sama dengan “'+esc(dup.title)+'” yang sudah ada di perpustakaanmu.</p>'+
      '<div class="actions"><button class="btn" id="dSkip">Lewati</button><button class="btn primary" id="dAdd">Tetap tambahkan</button></div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn" id="dSkipAll">Lewati semua duplikat</button><button class="btn" id="dAddAll">Tambahkan semua</button></div>',
    ()=>{
      $('#ov').dataset.lock='1';
      const done=(r,p)=>{if(p)dupPolicy=p;closeModal();res(r);};
      $('#dSkip').onclick=()=>done('skip');$('#dAdd').onclick=()=>done('add');
      $('#dSkipAll').onclick=()=>done('skip','skip');$('#dAddAll').onclick=()=>done('add','all');
    });
  });
}
function allColls(){return [...new Set(books.map(b=>b.collection).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));}
function allTags(){return [...new Set(books.flatMap(b=>b.tags||[]))].sort((a,b)=>a.localeCompare(b,'id'));}
function visibleBooks(){
  const q=$('#q').value.trim().toLowerCase(),sort=$('#sort').value;
  let list=books.filter(b=>!q||(b.title+' '+b.author+' '+(b.tags||[]).join(' ')+' '+(b.collection||'')).toLowerCase().includes(q));
  if(filt.status==='fav')list=list.filter(b=>b.fav);
  else if(filt.status!=='all')list=list.filter(b=>bookStatus(b)===filt.status);
  if(filt.coll)list=list.filter(b=>b.collection===filt.coll);
  if(filt.tag)list=list.filter(b=>(b.tags||[]).includes(filt.tag));
  list.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'id')
    :sort==='added'?b.added-a.added:(b.lastRead||0)-(a.lastRead||0)||b.added-a.added);
  return list;
}

function bulkIds(){return [...sel].filter(id=>books.some(b=>b.id===id));}
async function bulkAction(a){
  const ids=bulkIds();
  if(a==='all'){const v=visibleBooks();const allSel=v.every(b=>sel.has(b.id));v.forEach(b=>allSel?sel.delete(b.id):sel.add(b.id));renderLib();return;}

  if(a==='done'){for(const b of bs){b.done=true;await dbPut('meta',b);}renderLib();toast(bs.length+' buku ditandai selesai ✓');return;}

    return;
  }
  if(a==='tag'){
    openModal('<h3>Tag untuk '+ids.length+' buku</h3><label class="field"><span>Tag (pisahkan dengan koma)</span><input id="btI" placeholder="mis. klasik, romansa"></label>'+

      $('#btRm').onclick=async()=>{const t=parseTags($('#btI').value);for(const b of bs){b.tags=(b.tags||[]).filter(x=>!t.includes(x));await dbPut('meta',b);}closeModal();renderLib();toast('Tag dihapus');};
    });
    return;
  }
  if(a==='del'){
    openModal('<h3>Hapus '+ids.length+' buku?</h3><p style="line-height:1.5">Buku, penanda, sorotan, dan posisi baca akan hilang dari perangkat ini. Pertimbangkan ekspor cadangan dulu.</p>'+
      '<div class="actions"><button class="btn" id="bdX">Batal</button><button class="btn danger" id="bdOk">Hapus</button></div>',
    ()=>{
      $('#bdX').onclick=closeModal;

        if(!armed){armed=true;this.textContent='Yakin hapus?';return;}

        books=books.filter(x=>!ids.includes(x.id));sel.clear();selecting=false;
        closeModal();renderLib();toast(ids.length+' buku dihapus');
      };
    });
  }
}

const AR='\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF';
const AR_RUN=new RegExp('['+AR+']+(?:[\\s\\u200c\\u200d.,:;!?()«»"\'\\-–—،؛؟]*(?:['+AR+']+|[0-9]+))*','g');
const AR_TEST=new RegExp('['+AR+']');
const AR_G=new RegExp('['+AR+']','g'),LAT_G=/[A-Za-z\u00C0-\u024F]/g;
const AR_FIRST=new RegExp('['+AR+']|[A-Za-z\\u00C0-\\u024F]');
const toArDigits=t=>t.replace(/[0-9]/g,d=>String.fromCharCode(0x0660+(+d)));
const BLK_RE=/<(p|h2|h3|li|blockquote)((?:\s[^>]*)?)>([\s\S]*?)<\/\1>/g;
function wrapArabic(html){
  if(!AR_TEST.test(html))return html;
  ensureArabicFonts();
  return html.replace(BLK_RE,(m,tag,attrs,inner)=>{
    const plain=inner.replace(/<[^>]*>/g,'');
    const ar=(plain.match(AR_G)||[]).length;
    if(!ar)return m;
    const lat=(plain.match(LAT_G)||[]).length;
    const first=plain.match(AR_FIRST);
    const rtl=(first&&AR_TEST.test(first[0]))||ar/(ar+lat)>=0.75;
    let at=attrs||'';
    if(rtl&&tag!=='h2'&&tag!=='h3')at=/class="/.test(at)?at.replace('class="','class="arp '):at+' class="arp"';
    const wrapped=inner.replace(AR_RUN,m=>'<span class="ar" lang="ar" dir="rtl">'+(settings.arDigits==='latin'?m:toArDigits(m))+'</span>');
    return '<'+tag+at+' dir="'+(rtl?'rtl':'auto')+'">'+wrapped+'</'+tag+'>';
  });
}
let arLink=false;
function ensureArabicFonts(){
  if(arLink||settings.arFont==='trad')return;
  arLink=true;
  try{
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap';
    document.head.appendChild(l);
  }catch(e){}
}
function showChapter(i,pos){
  if(tts.on&&!tts.advancing)ttsStop(true);
  i=Math.max(0,Math.min(cur.chapters.length-1,i));
  cur.ch=i;cur.meta.ch=i;cur.meta.pos=pos||0;
  $('#rText').innerHTML=wrapArabic(cur.chapters[i].html);
  applyHighlights();
  const body=$('#rBody');body.scrollTop=0;
  applyMode();
  if(isPaged())requestAnimationFrame(()=>layoutPaged(pos||0));
  else requestAnimationFrame(()=>{body.scrollTop=(pos||0)*Math.max(0,body.scrollHeight-body.clientHeight);});
  $('#rPrev').disabled=i===0;$('#rNext').disabled=i===cur.chapters.length-1;
  updateProg();queueSave();
}
function updateProg(){
  const n=cur.chapters.length;
  $('#rProg').textContent='Bab '+(cur.ch+1)+'/'+n+(isPaged()&&pg.count>1?' · Hal '+(pg.page+1)+'/'+pg.count:'')+' · '+pct(cur.meta)+'%'+(remainTxt(cur.meta)?' · sisa ±'+remainTxt(cur.meta):'');
  $('#rBm').classList.toggle('on',!!nearBm());
}
function nearBm(){
  const tol=isPaged()?0.5/Math.max(1,pg.count-1):0.02;
  return (cur.meta.bookmarks||[]).find(b=>b.ch===cur.ch&&Math.abs(b.pos-(cur.meta.pos||0))<tol);
}
function visibleExcerpt(){
  if(isPaged()){
    try{
      const r=$('#clip').getBoundingClientRect(),x=r.left+30,y=r.top+40;
      let node,off=0;
      if(document.caretPositionFromPoint){const c=document.caretPositionFromPoint(x,y);if(c){node=c.offsetNode;off=c.offset;}}
      else if(document.caretRangeFromPoint){const c=document.caretRangeFromPoint(x,y);if(c){node=c.startContainer;off=c.startOffset;}}
      if(node&&node.nodeType===3){
        const t=node.nodeValue.slice(off).replace(/\s+/g,' ').trim();
        if(t.length>8)return t.slice(0,90);
      }
    }catch(e){}
    for(const el of $('#rText').children){
      if(el.getBoundingClientRect().right>$('#clip').getBoundingClientRect().left+10){
        const t=(el.textContent||'').trim().replace(/\s+/g,' ');
        if(t)return t.slice(0,90);
      }
    }
    return '';
  }
  const top=$('#rBody').getBoundingClientRect().top+8;
  for(const el of $('#rText').children){
    if(el.getBoundingClientRect().bottom>top){
      const t=(el.textContent||'').trim().replace(/\s+/g,' ');
      if(t)return t.slice(0,90);
    }
  }
  return '';
}

  updateProg();saveNow();
}

let coverTarget=null;
function makeCover(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('Gagal membaca gambar'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('File bukan gambar yang valid'));
      img.onload=()=>{
        const Wd=400,Ht=600,c=document.createElement('canvas');c.width=Wd;c.height=Ht;
        const g=c.getContext('2d'),sc=Math.max(Wd/img.width,Ht/img.height),w=img.width*sc,h=img.height*sc;
        g.fillStyle='#000';g.fillRect(0,0,Wd,Ht);
        g.drawImage(img,(Wd-w)/2,(Ht-h)/2,w,h);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let mgr=null;
const plain=h=>h.replace(/<[^>]*>/g,' ');
async function persistChapters(){
  const {meta,c}=mgr;
  meta.chapters=c.chapters.length;
  meta.words=c.chapters.reduce((a,x)=>a+words(plain(x.html)),0);
  meta.ch=Math.max(0,Math.min(meta.ch||0,c.chapters.length-1));
  await dbPut('content',c);await dbPut('meta',meta);renderLib();
}
function drawChapters(){
  const chs=mgr.c.chapters,n=chs.length;
  $('#chList').innerHTML=chs.map((ch,i)=>
    '<div class="crow" data-i="'+i+'"><div class="top2"><span class="n">'+(i+1)+'</span>'+
    '<input value="'+esc(ch.title)+'" aria-label="Judul bab '+(i+1)+'"></div>'+
    '<div class="tb"><button data-a="up"'+(i===0?' disabled':'')+'>↑</button>'+
    '<button data-a="down"'+(i===n-1?' disabled':'')+'>↓</button>'+
    '<button data-a="rep">⟳ Ganti isi</button>'+
    '<button data-a="del"'+(n===1?' disabled':'')+'>🗑 Hapus</button></div></div>').join('');
}
async function onChapClick(e){
  const btn=e.target.closest('button[data-a]');if(!btn||!mgr)return;
  const i=+btn.closest('.crow').dataset.i,{meta,c}=mgr,chs=c.chapters,a=btn.dataset.a;
  if(a==='rep'){mgr.rep=i;$('#chapFile').click();return;}
  if(a==='up'||a==='down'){
    const j=a==='up'?i-1:i+1;if(j<0||j>=chs.length)return;
    [chs[i],chs[j]]=[chs[j],chs[i]];
    if(meta.ch===i)meta.ch=j;else if(meta.ch===j)meta.ch=i;
    (meta.bookmarks||[]).forEach(b=>{if(b.ch===i)b.ch=j;else if(b.ch===j)b.ch=i;});
  }else if(a==='del'){
    if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Yakin hapus?';return;}
    chs.splice(i,1);
    if(meta.ch>i)meta.ch--;else if(meta.ch===i){meta.pos=0;meta.ch=Math.min(i,chs.length-1);}
    meta.bookmarks=(meta.bookmarks||[]).filter(b=>b.ch!==i);
    meta.bookmarks.forEach(b=>{if(b.ch>i)b.ch--;});
  }
  await persistChapters();drawChapters();
}

  ch.html=ch.html.replace(/^<h2>.*?<\/h2>/,'<h2>'+esc(ch.title)+'</h2>');
  await persistChapters();
}

async function saveBlob(name,blob){

  const url=URL.createObjectURL(blob);

const cleanStr=(v,max)=>typeof v==='string'?v.slice(0,max):'';

async function importBackup(file){
  let data;

    if(books.some(b=>b.id===m.id)){skipped++;continue;}
    const chapters=c.chapters.map((ch,i)=>({title:cleanStr(ch&&ch.title,120)||('Bagian '+(i+1)),html:sanitizeHtml(cleanStr(ch&&ch.html,25000000))}));

      added:cleanNum(m.added,Date.now()),lastRead:cleanNum(m.lastRead,0),
      ch:Math.max(0,Math.min(chapters.length-1,Math.floor(cleanNum(m.ch,0)))),
      pos:Math.max(0,Math.min(1,cleanNum(m.pos,0))),
      bookmarks:(Array.isArray(m.bookmarks)?m.bookmarks:[]).filter(b=>b&&typeof b==='object').slice(0,500).map(b=>({
        id:cleanStr(b.id,40).replace(/[^\w\-]/g,'')||uid(),

        pos:Math.max(0,Math.min(1,cleanNum(b.pos,0))),
        label:cleanStr(b.label,120),t:cleanNum(b.t,Date.now())})),
      highlights:(Array.isArray(m.highlights)?m.highlights:[]).filter(h=>h&&typeof h==='object').slice(0,2000).map(h=>({
        id:cleanStr(h.id,40).replace(/[^\w\-]/g,'')||uid(),
        ch:Math.max(0,Math.min(chapters.length-1,Math.floor(cleanNum(h.ch,0)))),
        s:Math.max(0,Math.floor(cleanNum(h.s,0))),e:Math.max(0,Math.floor(cleanNum(h.e,0))),
        text:cleanStr(h.text,300),c:[1,2,3,4].includes(h.c)?h.c:1,note:cleanStr(h.note,2000),t:cleanNum(h.t,Date.now())})).filter(h=>h.e>h.s),
      readSecs:Math.max(0,cleanNum(m.readSecs,0))
    };

    if(m.done===true)meta.done=true;
    if(typeof m.collection==='string'&&m.collection.trim())meta.collection=m.collection.trim().slice(0,40);
    if(Array.isArray(m.tags))meta.tags=parseTags(m.tags.filter(x=>typeof x==='string').join(','));

}

function layoutPaged(pos){

  const W=Math.max(200,Math.floor(Math.min(body.clientWidth,760)));

function applyPage(animate){

const HL_COLORS=['','#f5d742','#6fd08a','#6fb2ff','#ff8fbf'];
function textNodesOf(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;
  while((n=w.nextNode()))a.push(n);
  return a;
}
function offsetOf(root,node,off){
  const r=document.createRange();r.selectNodeContents(root);r.setEnd(node,off);
  return r.toString().length;
}
function applyHighlights(){
  const root=$('#rText');
  root.querySelectorAll('mark.hl').forEach(m=>{
    const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();
  });
  if(!cur)return;
  const list=(cur.meta.highlights||[]).filter(h=>h.ch===cur.ch);
  if(!list.length)return;
  const nodes=textNodesOf(root);let acc=0;
  const info=nodes.map(n=>{const o={n,s:acc,e:acc+n.nodeValue.length};acc=o.e;return o;});
  const perNode=new Map();
  for(const h of list){
    for(const o of info){
      if(o.e<=h.s||o.s>=h.e)continue;
      const a=Math.max(h.s,o.s)-o.s,b=Math.min(h.e,o.e)-o.s;
      if(!perNode.has(o.n))perNode.set(o.n,[]);
      perNode.get(o.n).push({a,b,h});
    }
  }
  perNode.forEach((segs,node)=>{
    segs.sort((x,y)=>y.a-x.a);
    let limit=Infinity;
    for(const sg of segs){
      const b=Math.min(sg.b,limit);
      if(sg.a>=b)continue;
      limit=sg.a;
      try{
        const r=document.createRange();r.setStart(node,sg.a);r.setEnd(node,b);
        const m=document.createElement('mark');
        m.className='hl c'+sg.h.c+(sg.h.note?' note':'');m.dataset.id=sg.h.id;
        r.surroundContents(m);
      }catch(e){}
    }
  });
}
function currentSel(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return null;
  const r=sel.getRangeAt(0),root=$('#rText');
  if(!root.contains(r.commonAncestorContainer))return null;
  const s=offsetOf(root,r.startContainer,r.startOffset),e=offsetOf(root,r.endContainer,r.endOffset);
  if(e<=s)return null;
  return {s,e,text:r.toString().replace(/\s+/g,' ').trim()};
}

const tts={on:false,idx:0,items:[],gen:0,advancing:false,sleepT:null,sleepAt:0,sleepEnd:false,warnedAr:false};
const hasTTS=()=>typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function chunkText(t){
  const parts=t.match(/[^.!?؟۔。！？…]+[.!?؟۔。！？…]*["”»)]*\s*/g)||[t];
  const out=[];let buf='';
  for(const p of parts){if((buf+p).length>180&&buf){out.push(buf.trim());buf=p;}else buf+=p;}
  if(buf.trim())out.push(buf.trim());
  return out.flatMap(x=>x.length>220?(x.match(/.{1,200}(\s|$)/g)||[x]).map(s=>s.trim()).filter(Boolean):[x]);
}
function ttsItems(){
  const items=[];
  $('#rText').querySelectorAll('p,h2,h3,li,blockquote').forEach(el=>{
    const text=el.textContent.replace(/\s+/g,' ').trim();
    if(!text)return;
    const ar=(text.match(AR_G)||[]).length,lat=(text.match(LAT_G)||[]).length;
    chunkText(text).forEach(c=>items.push({el,text:c,ar:ar>lat}));
  });
  return items;
}
function firstVisibleItem(items){
  const b=$('#rBody').getBoundingClientRect(),c=$('#clip').getBoundingClientRect();
  for(let i=0;i<items.length;i++){
    const r=items[i].el.getBoundingClientRect();
    if(isPaged()){if(r.right>c.left+5&&r.bottom>b.top)return i;}
    else if(r.bottom>b.top+10)return i;
  }
  return 0;
}
function pickVoice(ar){
  const vs=speechSynthesis.getVoices();
  if(ar)return vs.find(v=>/^ar/i.test(v.lang))||null;
  if(settings.ttsVoice){const v=vs.find(x=>x.voiceURI===settings.ttsVoice);if(v&&!/^ar/i.test(v.lang))return v;}
  return vs.find(v=>/^id/i.test(v.lang))||null;
}
function ttsMark(el){
  $('#rText').querySelectorAll('.tts-cur').forEach(x=>x.classList.remove('tts-cur'));
  if(el){el.classList.add('tts-cur');scrollToEl(el);}
}
function ttsSpeak(){
  if(!tts.on||!cur)return;
  const it=tts.items[tts.idx];
  if(!it){
    if(cur.ch<cur.chapters.length-1&&!tts.sleepEnd){
      tts.advancing=true;showChapter(cur.ch+1,0);
      const g=tts.gen;
      setTimeout(()=>{tts.advancing=false;if(!tts.on||tts.gen!==g)return;tts.items=ttsItems();tts.idx=0;ttsSpeak();},500);
    }else ttsStop(false,tts.sleepEnd?'Timer tidur: berhenti di akhir bab 😴':'Selesai dibaca');
    return;
  }
  ttsMark(it.el);
  const g=tts.gen,u=new SpeechSynthesisUtterance(it.text);
  u.rate=settings.ttsRate||1;
  const v=pickVoice(it.ar);
  if(v){u.voice=v;u.lang=v.lang;}
  else{u.lang=it.ar?'ar-SA':'id-ID';if(it.ar&&!tts.warnedAr){tts.warnedAr=true;toast('Suara Arab tidak ditemukan di perangkat; bagian Arab mungkin dilewati',4500);}}
  u.onend=()=>{if(tts.on&&tts.gen===g){tts.idx++;ttsSpeak();}};
  u.onerror=e=>{if(!tts.on||tts.gen!==g)return;if(e&&(e.error==='interrupted'||e.error==='canceled'))return;tts.idx++;ttsSpeak();};
  speechSynthesis.speak(u);
}
function ttsStart(){
  if(!hasTTS()){toast('Perangkat ini tidak mendukung baca nyaring');return;}
  speechSynthesis.cancel();tts.gen++;
  tts.items=ttsItems();
  if(!tts.items.length){toast('Tidak ada teks untuk dibaca');return;}
  tts.idx=firstVisibleItem(tts.items);tts.on=true;
  noWake=false;updateWakeLock();
  $('#rTts').classList.add('on');
  ttsSpeak();
}
function ttsStop(silent,msg){
  if(hasTTS()){tts.gen++;try{speechSynthesis.cancel();}catch(e){}}
  const was=tts.on;tts.on=false;
  if($('#rTts'))$('#rTts').classList.remove('on');
  $('#rText').querySelectorAll('.tts-cur').forEach(x=>x.classList.remove('tts-cur'));
  if(silent)return;
  if(was&&msg)toast(msg,3500);
}
function ttsPauseToggle(){
  if(tts.on){const i=tts.idx;ttsStop(true);tts.idx=i;tts.paused=true;}
  else if(tts.paused&&cur){tts.paused=false;tts.items=ttsItems();tts.idx=Math.min(tts.idx,Math.max(0,tts.items.length-1));tts.on=true;$('#rTts').classList.add('on');speechSynthesis.cancel();tts.gen++;ttsSpeak();}
  else ttsStart();
}
function setSleep(min){
  clearTimeout(tts.sleepT);tts.sleepAt=0;tts.sleepEnd=false;
  if(min==='end'){tts.sleepEnd=true;toast('Berhenti di akhir bab ini');return;}
  if(!min)return;
  tts.sleepAt=Date.now()+min*60000;

    ttsStop(false,'Timer tidur selesai 😴');

}

    });

/*ZIP-BEGIN*/
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function deflateRaw(u8){
  if(typeof CompressionStream==='undefined')return null;
  try{return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());}catch(e){return null;}
}
/* files: [{name, data:Uint8Array|string, store?:boolean}] → Uint8Array (ZIP) */
async function zipBuild(files){
  const te=new TextEncoder(),parts=[],central=[];
  const now=new Date();
  const dosT=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosD=((Math.max(1980,now.getFullYear())-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  let off=0;
  for(const f of files){
    const nameB=te.encode(f.name);
    const raw=typeof f.data==='string'?te.encode(f.data):f.data;
    let method=0,body=raw;
    if(!f.store&&raw.length>200){const d=await deflateRaw(raw);if(d&&d.length<raw.length){method=8;body=d;}}
    const crc=crc32(raw);
    const lh=new Uint8Array(30+nameB.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,method,true);
    dv.setUint16(10,dosT,true);dv.setUint16(12,dosD,true);dv.setUint32(14,crc,true);
    dv.setUint32(18,body.length,true);dv.setUint32(22,raw.length,true);dv.setUint16(26,nameB.length,true);dv.setUint16(28,0,true);
    lh.set(nameB,30);
    const ch=new Uint8Array(46+nameB.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,method,true);
    cv.setUint16(12,dosT,true);cv.setUint16(14,dosD,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,body.length,true);cv.setUint32(24,raw.length,true);cv.setUint16(28,nameB.length,true);
    cv.setUint32(42,off,true);ch.set(nameB,46);
    parts.push(lh,body);central.push(ch);off+=lh.length+body.length;
  }
  const cdSize=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  const all=[...parts,...central,end],total=all.reduce((a,c)=>a+c.length,0),out=new Uint8Array(total);
  let p=0;for(const c of all){out.set(c,p);p+=c.length;}
  return out;
}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function dataUriBytes(uri){
  const m=/^data:([^;,]+);base64,([\s\S]*)$/.exec(uri||'');
  if(!m)return null;
  const bin=atob(m[2]),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return {type:m[1],bytes:u8,ext:m[1]==='image/png'?'png':m[1]==='image/gif'?'gif':m[1]==='image/webp'?'webp':'jpg'};
}
/*ZIP-END*/
const cleanXml=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'');

/* --- TXT --- */
function chapterBlocksText(html){
  const d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  const out=[];
  const walk=el=>{
    for(const n of el.childNodes){
      if(n.nodeType!==1)continue;
      const t=n.localName.toLowerCase();
      if(t==='ul'||t==='ol'){let i=1;for(const li of n.children)out.push((t==='ol'?(i++)+'. ':'• ')+li.textContent.replace(/\s+/g,' ').trim());}
      else if(t==='hr')out.push('* * *');
      else if(t==='figure'||t==='img'){/* gambar dilewati pada TXT */}
      else if(['p','h2','h3','blockquote','pre'].includes(t)){const x=(t==='pre'?n.textContent:n.textContent.replace(/\s+/g,' ')).trim();if(x)out.push({h:t==='h2'||t==='h3',t:x});}
      else walk(n);
    }
  };
  walk(d.body);
  return out;
}
function buildTxt(meta,chapters){
  let out=meta.title+'\n'+(meta.author?meta.author+'\n':'')+'\n';
  chapters.forEach((c,i)=>{
    const bl=chapterBlocksText(c.html);
    const startsH=bl.length&&typeof bl[0]==='object'&&bl[0].h;
    out+='\n\n'+(startsH?'':c.title+'\n\n');
    out+=bl.map(b=>typeof b==='string'?b:(b.h?b.t.toUpperCase():b.t)).join('\n\n')+'\n';
  });
  return new Blob(['\ufeff'+out.replace(/\n{4,}/g,'\n\n\n')],{type:'text/plain;charset=utf-8'});
}
