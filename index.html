const DOCX_NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
const ARF='<w:rFonts w:ascii="Traditional Arabic" w:hAnsi="Traditional Arabic" w:cs="Traditional Arabic"/><w:rtl/><w:sz w:val="34"/><w:szCs w:val="34"/>';
function dxRun(text,f){
  const base=(f.b?'<w:b/><w:bCs/>':'')+(f.i?'<w:i/><w:iCs/>':'')+(f.sup?'<w:vertAlign w:val="superscript"/>':'')+(f.sub?'<w:vertAlign w:val="subscript"/>':'')+(f.mono?'<w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:sz w:val="20"/>':'');
  let out='';
  const push=(t,ar)=>{if(!t)return;out+='<w:r><w:rPr>'+(ar?ARF:'')+base+'</w:rPr><w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';};
  let last=0,m;AR_RUN.lastIndex=0;
  while((m=AR_RUN.exec(text))){push(text.slice(last,m.index),false);push(settings.arDigits==='latin'?m[0]:toArDigits(m[0]),true);last=m.index+m[0].length;}
  push(text.slice(last),false);
  return out;
}
function dxInline(node,f,ctx){
  let out='';
  for(const n of node.childNodes){
    if(n.nodeType===3){out+=dxRun(n.nodeValue.replace(f.mono?/$^/:/\s+/g,' '),f);continue;}
    if(n.nodeType!==1)continue;
    const t=n.localName.toLowerCase();
    if(t==='br'){out+='<w:r><w:br/></w:r>';continue;}
    if(t==='img'){out+=dxImage(n.getAttribute('src'),ctx);continue;}
    const g=Object.assign({},f);
    if(t==='strong'||t==='b')g.b=true;else if(t==='em'||t==='i')g.i=true;else if(t==='sup')g.sup=true;else if(t==='sub')g.sub=true;else if(t==='code')g.mono=true;
    out+=dxInline(n,g,ctx);
  }
  return out;
}
function dxImage(src,ctx){
  const im=ctx.imgs.get(src);if(!im)return '';
  const maxW=5486400;let cx=im.w*9525,cy=im.h*9525;
  if(cx>maxW){cy=Math.round(cy*maxW/cx);cx=maxW;}
  const id=im.n;
  return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+id+'" name="Gambar '+id+'"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="'+id+'" name="img'+id+'"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+im.rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
}
function dxPara(inner,opt){
  opt=opt||{};
  const ppr=(opt.style?'<w:pStyle w:val="'+opt.style+'"/>':'')+(opt.pb?'<w:pageBreakBefore/>':'')+(opt.rtl?'<w:bidi/>':'')+(opt.ind?'<w:ind w:left="'+opt.ind+'"/>':'')+(opt.center?'<w:jc w:val="center"/>':'');
  return '<w:p>'+(ppr?'<w:pPr>'+ppr+'</w:pPr>':'')+inner+'</w:p>';
}
function dxBlocks(html,ctx,firstHeadingBreak){
  const d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  let out='',firstH=firstHeadingBreak;
  const rtlOf=txt=>{const a=(txt.match(AR_G)||[]).length,l=(txt.match(LAT_G)||[]).length;const f=txt.match(AR_FIRST);return a>0&&((f&&AR_TEST.test(f[0]))||a/(a+l)>=0.75);};
  const walk=el=>{
    for(const n of el.childNodes){
      if(n.nodeType!==1)continue;
      const t=n.localName.toLowerCase(),txt=n.textContent;
      if(t==='h2'||t==='h3'){out+=dxPara(dxInline(n,{},ctx),{style:t==='h2'?'Heading1':'Heading2',pb:t==='h2'&&firstH,rtl:rtlOf(txt)});if(t==='h2')firstH=false;}
      else if(t==='p'){out+=dxPara(dxInline(n,{},ctx),{rtl:rtlOf(txt),center:n.classList.contains('center')});}
      else if(t==='blockquote'){out+=dxPara(dxInline(n,{i:true},ctx),{ind:720,rtl:rtlOf(txt)});}
      else if(t==='pre'){for(const ln of txt.split('\n'))out+=dxPara(dxRun(ln,{mono:true}),{});}
      else if(t==='hr'){out+=dxPara(dxRun('* * *',{}),{center:true});}
      else if(t==='ul'||t==='ol'){let i=1;for(const li of n.children){out+=dxPara(dxRun((t==='ol'?(i++)+'. ':'• '),{})+dxInline(li,{},ctx),{ind:540,rtl:rtlOf(li.textContent)});}}
      else if(t==='figure'||t==='div'){
        const im=n.querySelector&&n.querySelector('img');
        if(t==='figure'&&im)out+=dxPara(dxImage(im.getAttribute('src'),ctx),{center:true});else walk(n);
      }
      else if(t==='img')out+=dxPara(dxImage(n.getAttribute('src'),ctx),{center:true});
      else walk(n);
    }
  };
  walk(d.body);
  return {xml:out,firstH};
}
async function buildDocx(meta,chapters){
  const ctx={imgs:new Map()},mediaFiles=[];let n=0;
  const srcs=new Set();
  chapters.forEach(c=>{(c.html.match(/<img\b[^>]*src="data:[^"]+"/g)||[]).forEach(t=>{const m=/src="(data:[^"]+)"/.exec(t);if(m)srcs.add(m[1]);});});
  for(const src of srcs){
    const di=dataUriBytes(src);if(!di||!['png','jpg','gif'].includes(di.ext))continue;
    const dim=await new Promise(r=>{const im=new Image();im.onload=()=>r({w:im.naturalWidth||400,h:im.naturalHeight||300});im.onerror=()=>r({w:400,h:300});im.src=src;});
    n++;ctx.imgs.set(src,{n,rid:'rIdImg'+n,w:dim.w,h:dim.h});
    mediaFiles.push({name:'word/media/image'+n+'.'+di.ext,data:di.bytes,store:true,rid:'rIdImg'+n,ext:di.ext});
  }
  let body=dxPara(dxRun(meta.title,{}),{style:'Title',center:true});
  if(meta.author)body+=dxPara(dxRun(meta.author,{}),{center:true});
  let first=true;
  for(const c of chapters){
    let html=cleanXml(c.html);
    let pre='';
    if(!/^<h[23]/.test(html))pre=dxPara(dxRun(c.title,{}),{style:'Heading1',pb:true});
    const r=dxBlocks(html,ctx,true);
    body+=pre+r.xml;first=false;
  }
  const docXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document '+DOCX_NS+'><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Cambria" w:hAnsi="Cambria" w:cs="Traditional Arabic"/><w:sz w:val="23"/><w:szCs w:val="28"/><w:lang w:val="id-ID" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="140" w:line="320" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'+
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:before="2400" w:after="240"/><w:jc w:val="center"/></w:pPr><w:rPr><w:b/><w:sz w:val="56"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="240"/><w:jc w:val="center"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="36"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="28"/></w:rPr></w:style></w:styles>';
  const exts=[...new Set(mediaFiles.map(m=>m.ext))];
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'+exts.map(e=>'<Default Extension="'+e+'" ContentType="image/'+(e==='jpg'?'jpeg':e)+'"/>').join('')+'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>';
  const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdSt" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+mediaFiles.map(m=>'<Relationship Id="'+m.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+m.name.split('/').pop()+'"/>').join('')+'</Relationships>';
  const core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>'+xe(meta.title)+'</dc:title><dc:creator>'+xe(meta.author||'')+'</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">'+new Date().toISOString().replace(/\.\d+Z$/,'Z')+'</dcterms:created></cp:coreProperties>';
  const files=[{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rels},{name:'word/document.xml',data:docXml},{name:'word/styles.xml',data:styles},{name:'word/_rels/document.xml.rels',data:docRels},{name:'docProps/core.xml',data:core},...mediaFiles];
  return new Blob([await zipBuild(files)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* --- Menu ekspor per buku --- */
function exportMenu(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  openModal('<h3>Ekspor “'+esc(b.title)+'”</h3>'+
    '<div class="menurow"><button class="btn" data-f="epub">📘 EPUB</button><button class="btn" data-f="docx">📄 DOCX (Word)</button><button class="btn" data-f="txt">📝 TXT</button><button class="btn" data-f="json">💾 Cadangan .json</button></div>'+
    '<p class="muted">EPUB dan DOCX memuat daftar bab, sampul (EPUB), dan gambar. TXT hanya teks. Cadangan .json memuat penanda, sorotan, dan posisi baca supaya bisa dipulihkan di aplikasi ini.</p>'+
    '<div class="actions"><button class="btn primary" id="xOk">Tutup</button></div>',
  root=>{
    $('#xOk').onclick=closeModal;
    root.querySelectorAll('[data-f]').forEach(btn=>btn.onclick=async()=>{
      const f=btn.dataset.f;closeModal();
      if(f==='json'){exportBooks([id]);return;}
      toast('Menyiapkan '+f.toUpperCase()+'…',0);
      try{
        const c=await dbGet('content',id);
        if(!c)throw new Error('isi buku tidak ditemukan');
        await tick();
        const blob=f==='txt'?buildTxt(b,c.chapters):f==='epub'?await buildEpub(b,c.chapters):await buildDocx(b,c.chapters);
        await saveBlob(safeName(b.title)+'.'+f,blob);
        toast(f.toUpperCase()+' siap ✓');
      }catch(e){
        if(e&&e.code==='declined')toast('Dibatalkan');
        else toast('Gagal mengekspor: '+((e&&(e.message||e.code))||'kesalahan'),5000);
      }
    });
  });
}

/* ---------- Event perpustakaan ---------- */
const fileInput=$('#file');
$('#addBtn').onclick=$('#addBtn2').onclick=()=>{appendTarget=null;fileInput.click();};
fileInput.onchange=async()=>{
  const f=[...fileInput.files];fileInput.value='';
  const t=appendTarget;appendTarget=null;
  if(t)await appendFiles(t,f);else await importFiles(f);
};
$('#q').oninput=renderLib;$('#sort').onchange=renderLib;
$('#stChips').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b)return;filt.status=b.dataset.st;renderLib();});
$('#fColl').onchange=()=>{filt.coll=$('#fColl').value;renderLib();};
$('#fTag').onchange=()=>{filt.tag=$('#fTag').value;renderLib();};
$('#selMode').onclick=()=>{selecting=!selecting;if(!selecting)sel.clear();renderLib();};
$('#bulkBar').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b)bulkAction(b.dataset.b);});
$('#lib').addEventListener('click',e=>{
  if(selecting){
    const card=e.target.closest('.card');
    if(card){const id=card.dataset.id;if(sel.has(id))sel.delete(id);else sel.add(id);renderLib();}
    return;
  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id||(t.closest('.card')||{dataset:{}}).dataset.id;
  if(t.dataset.act==='open'||t.dataset.act==='resume')openBook(id);
  else if(t.dataset.act==='menu')bookMenu(id);
});
let dragN=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragN++;$('#veil').hidden=false;}});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#veil').hidden=true;});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();dragN=0;$('#veil').hidden=true;
  if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files);
});

/* ---------- Mulai ---------- */
(async function init(){
  applySettings();
  const ok=await openDB();
  if(!ok){
    $('#warn').innerHTML='<div class="notice">Penyimpanan permanen tidak tersedia di mode ini — buku hanya tersimpan sementara selama halaman terbuka.</div>';
  }else{
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  }
  try{books=await dbAll('meta');}catch(e){books=[];}
  renderLib();
})();
})();
